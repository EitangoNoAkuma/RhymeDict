claude_cowork_整理:
  結論:
    一言: "Claude Coworkは会話AIではなく、作業委任AIとして使うべき"
    本質:
      - "プロンプト力より、運用設計のほうが重要"
      - "単発で賢く使うより、反復工程を分業・定型化・自動化するほうが価値が高い"
      - "英単語の悪魔への応用では、創造性そのものではなく、創造性を安定的に出す下請け工程を渡すのが正解"

  記事要約:
    定義:
      claude_chat: "会話・壁打ち・草案作成向け"
      claude_code: "開発者向け。端末・コード実行・GitHub操作向け"
      claude_cowork: "非技術者でも使える作業委任ツール。計画→分解→実行→成果物納品まで担当"
    重要ポイント:
      - "sandboxフォルダを作り、触らせる範囲を限定する"
      - "projectを分けて文脈汚染を防ぐ"
      - "about_me.md, brand_voice.md, working_preferences.md で恒常文脈を与える"
      - "指示は 個人設定 / Cowork全体 / project個別 の3層で管理する"
      - "外部接続は connectors→browser use→computer use の順で使う"
      - "自動化は skills→plugins→scheduled tasks→dispatch の順で積み上げる"
      - "トークン節約のため、長い会話を引きずらず、話題ごとにウィンドウを分ける"
      - "外部skillは安全確認必須"
    要するに: "AIを賢く使うな。AIに安全に仕事を渡す運用を作れ"

  英単語の悪魔への応用:
    問題設定:
      現状ボトルネック:
        - "制作工程が属人的"
        - "毎回ゼロから考えるため認知負荷が高い"
        - "ネタ発見から投稿・画像・分析までが未分業"
      目標: "勝ち筋のある制作工程を分業・定型化・自動化する"
    分解すべき工程:
      - "ネタ発見"
      - "語義調査"
      - "語源調査"
      - "X投稿フォーマット化"
      - "モンスター図鑑の要件定義"
      - "画像プロンプト化"
      - "引用リポスト文生成"
      - "反応分析"
      - "再利用・再展開"
    project設計:
      project_a:
        名前: "英単語X投稿"
        目的: "短文フォーマット専用"
      project_b:
        名前: "英単語モンスター図鑑"
        目的: "要件定義・画像プロンプト専用"
      project_c:
        名前: "引用リポスト研究所"
        目的: "他人ポストに対する切り返し専用"
      project_d:
        名前: "言語・聖書・思想メモ"
        目的: "長文研究・ネタ貯蔵専用"
    必須md:
      about_me_md:
        役割: "活動目的・読者像・収益や成長の優先順位を固定"
      brand_voice_md:
        役割: "文体・圧縮度・比喩・嫌いな言い回し・句読点ルールを固定"
      working_preferences_md:
        役割: "出力形式・禁止事項・保存場所・ファイル命名を固定"
      content_rubric_md:
        役割: "良い投稿 / 悪い投稿 / 60点→120点改善観点を明文化"
    最初に自動化すべきもの:
      - 名称: "投稿整形skill"
        入力: ["単語", "語義", "例文", "語源メモ"]
        出力: ["X投稿完成版", "字数チェック", "禁止表現チェック"]
      - 名称: "モンスター図鑑要件定義skill"
        入力: ["単語", "例文", "語源", "文脈"]
        出力: ["一文コア", "構造設計", "禁止要素", "レイアウト要件", "QAチェック"]
      - 名称: "引用リポストskill"
        入力: ["元ポストURLまたは要約", "狙う読者", "温度感"]
        出力: ["3案", "フック違い", "思想寄り/実務寄り/詩的寄りの差分"]
      - 名称: "ネタ収集skill"
        入力: ["保存記事", "保存ポスト", "メモ"]
        出力: ["要約", "単語候補", "引用候補", "長文化候補"]
      - 名称: "週次レビューskill"
        入力: ["今週の投稿", "指標"]
        出力: ["伸びた要因", "失敗要因", "次週改善案"]
    実装原則:
      - "短文・画像・思想メモを混ぜない"
      - "一つの素材から複数形式へ再展開する"
      - "勝ちパターンをskill化し、毎回会話で再発明しない"
      - "要件定義とQAを先に固定し、出力の揺れを減らす"

  専門家10人:
    - 専門家: "ブランド戦略家"
      主張: "英単語の悪魔は英語解説アカウントではなく、言語で世界を読む人格ブランドとして固定すべき"
    - 専門家: "グロースマーケター"
      主張: "投稿単体の反応ではなく、保存率・フォロー転換率・再訪率で設計すべき"
    - 専門家: "コンテンツ戦略家"
      主張: "単発投稿ではなく、図鑑・引用・短文・長文を一つのコンテンツOSとして設計すべき"
    - 専門家: "SNSオーディエンス研究者"
      主張: "読者は英語学習だけでなく、知的快感・言語ロマン・世界観更新を求めている"
    - 専門家: "戦略コンサルタント"
      主張: "全工程を一度に改善するのでなく、最も時間を食うボトルネックから標準化すべき"
    - 専門家: "オペレーション設計の専門家"
      主張: "良い作品の前に、良い生産ラインを作れ。命名規則・テンプレ・レビュー手順を固定すべき"
    - 専門家: "ナレッジマネジメントの専門家"
      主張: "語源・構図・比喩・失敗例を再利用可能な部品に分解し、検索可能にすべき"
    - 専門家: "UX/サービスデザイナー"
      主張: "初見接触→理解→保存→再訪→ファン化までの読者体験を設計すべき"
    - 専門家: "ビジュアルデザイナー/アートディレクター"
      主張: "モンスター図鑑はイラスト企画ではなく、一目で意味が伝わる情報設計として統一すべき"
    - 専門家: "AI自動化アーキテクト"
      主張: "Chat的に使わず、sandbox・project分離・skills・scheduled tasksの順で統治構造を作るべき"

  専門家たちの議論の収束点:
    マーケター系:
      - "勝ち筋の再現が重要"
      - "反応の量より、導線の質を見るべき"
    戦略コンサル系:
      - "ボトルネックから順に標準化するべき"
      - "属人性を減らし、反復部分を機械化するべき"
    デザイン系:
      - "意味・体験・視覚の一貫性がブランド資産になる"
      - "装飾ではなく、認知のしやすさを設計するべき"
    AI運用系:
      - "プロンプト芸よりアーキテクチャ"
      - "便利そうだから全部つなぐのではなく、権限と責務を分離するべき"

  統一的見解:
    一文要約: "Claude Coworkは、英単語の悪魔の創造性を代替する道具ではなく、その創造性を安定供給する制作基盤として使うべき"
    実行指針:
      - "ブランドルールを明文化する"
      - "projectを用途ごとに分離する"
      - "勝ちパターンをskill化する"
      - "ネタ→投稿→画像→分析の流れを部品化する"
      - "反復工程だけを自動化する"
    最重要警告: "AIに創造の中核まで渡すと凡庸化する。渡すべきなのは下請け工程と運用負荷"
