<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>韻辞書 - 育てる韻の辞書</title>
  <style>
:root {
  --bg: #0d0d0d;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #333;
  --text: #f0f0f0;
  --text-dim: #999;
  --accent: #a855f7;
  --accent-glow: rgba(168, 85, 247, 0.35);
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --orange: #f97316;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
header { text-align: center; padding: 2rem 1rem 1rem; border-bottom: 1px solid var(--border); }
header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 0.05em;
}
header p { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.3rem; }
.tabs { display: flex; justify-content: center; gap: 0.5rem; padding: 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab-btn {
  padding: 0.5rem 1.2rem; border: 1px solid var(--border); border-radius: 999px;
  background: transparent; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
}
.tab-btn:hover { border-color: var(--accent); color: var(--text); }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
.container { max-width: 800px; margin: 0 auto; padding: 1rem; }
.panel { display: none; }
.panel.active { display: block; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 0.3rem; }
.form-hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.2rem; }
input[type="text"], input[type="search"] {
  width: 100%; padding: 0.7rem 1rem; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 1rem; outline: none; transition: border-color 0.2s;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.tag-input-wrap {
  display: flex; gap: 0.4rem; margin-bottom: 0.5rem;
}
.tag-input-wrap input { flex: 1; }
.tag-input-wrap button { flex-shrink: 0; }
.tag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.7rem;
  border: 1px solid var(--border); border-radius: 999px; font-size: 0.8rem;
  cursor: pointer; transition: all 0.2s; color: var(--text-dim); user-select: none;
}
.tag-chip:hover { border-color: var(--accent); color: var(--text); }
.tag-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-chip .tag-remove {
  margin-left: 0.2rem; font-size: 0.7rem; opacity: 0.6; cursor: pointer;
}
.tag-chip .tag-remove:hover { opacity: 1; }
.btn {
  padding: 0.7rem 1.5rem; border: none; border-radius: var(--radius);
  font-size: 0.95rem; cursor: pointer; transition: all 0.2s; font-weight: 600;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 0 16px var(--accent-glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 24px var(--accent-glow); }
.btn-small { padding: 0.3rem 0.7rem; font-size: 0.8rem; border-radius: 8px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { border-color: var(--accent); color: var(--text); }
.btn-tag-add { padding: 0.5rem 0.8rem; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); cursor: pointer; font-size: 0.85rem; }
.btn-tag-add:hover { border-color: var(--accent); }
.preview-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin: 1rem 0; }
.preview-box .romaji { color: var(--accent); font-family: monospace; font-size: 1.1rem; }
.preview-box .vowels {
  font-size: 1.3rem; font-weight: bold; letter-spacing: 0.15em; margin-top: 0.3rem;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.word-grid { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
.word-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.2s;
}
.word-card:hover { border-color: var(--accent); }
.word-info { flex: 1; }
.word-display { font-size: 1.2rem; font-weight: bold; }
.word-reading { color: var(--text-dim); font-size: 0.85rem; margin-left: 0.5rem; }
.word-meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.3rem; flex-wrap: wrap; }
.vowel-badge { font-family: monospace; font-size: 0.85rem; color: var(--accent); background: rgba(168,85,247,0.15); padding: 0.15rem 0.5rem; border-radius: 6px; }
.tag-badge { font-size: 0.75rem; color: var(--text-dim); border: 1px solid var(--border); padding: 0.1rem 0.4rem; border-radius: 6px; }
.word-actions { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }
.hardness-badge { font-size: 0.8rem; font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 6px; }
.hardness-gachigachi { background: var(--green); color: #fff; }
.hardness-katai { background: var(--yellow); color: #000; }
.hardness-maamaa { background: var(--orange); color: #fff; }
.hardness-yawarakai { background: var(--red); color: #fff; }
.rhyme-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center;
}
.rhyme-match-info { font-size: 0.85rem; color: var(--text-dim); }
.fav-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center;
}
.fav-pair { display: flex; align-items: center; gap: 0.8rem; font-size: 1.1rem; flex-wrap: wrap; }
.fav-vs { color: var(--accent); font-weight: bold; }
.empty { text-align: center; color: var(--text-dim); padding: 3rem 1rem; font-size: 0.95rem; }
.filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.filter-bar input { flex: 1; min-width: 200px; }
.vowel-group-header {
  font-family: monospace; font-size: 0.9rem; color: var(--accent); background: var(--surface2);
  padding: 0.4rem 0.8rem; border-radius: 8px; margin-top: 1rem; margin-bottom: 0.4rem; letter-spacing: 0.1em;
}
.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--surface2); border: 1px solid var(--accent); color: var(--text);
  padding: 0.7rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem;
  opacity: 0; transition: all 0.3s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.suggestions { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
.suggestion {
  font-size: 0.75rem; color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border);
  padding: 0.15rem 0.5rem; border-radius: 999px; cursor: pointer; transition: all 0.2s;
}
.suggestion:hover { border-color: var(--accent); color: var(--text); }
@media (max-width: 600px) {
  header h1 { font-size: 1.5rem; }
  .container { padding: 0.5rem; }
  .word-card { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
  .word-actions { width: 100%; justify-content: flex-end; }
  .rhyme-card { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
}
  </style>
</head>
<body>
  <header>
    <h1>韻辞書</h1>
    <p>育てる韻の辞書</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="register">登録</button>
    <button class="tab-btn" data-tab="dictionary">辞書</button>
    <button class="tab-btn" data-tab="search">逆引き</button>
    <button class="tab-btn" data-tab="favorites">お気に入り</button>
  </nav>

  <div class="container">
    <!-- Register Panel -->
    <div id="panel-register" class="panel active">
      <div class="form-group">
        <label>読み（ひらがな）*</label>
        <input type="text" id="input-reading" placeholder="例: みらい">
      </div>
      <div class="form-group">
        <label>表示（任意：漢字・カタカナなど）</label>
        <input type="text" id="input-display" placeholder="例: 未来、ミライ（空欄ならひらがなで表示）">
        <div class="form-hint">入力しない場合、読みがそのまま表示名になります</div>
      </div>
      <div id="live-preview" class="preview-box" style="display:none">
        <div>ローマ字: <span class="romaji" id="preview-romaji"></span></div>
        <div>母音パターン: <span class="vowels" id="preview-vowels"></span></div>
      </div>
      <div class="form-group">
        <label>タグ（任意・自由入力）</label>
        <div class="tag-input-wrap">
          <input type="text" id="input-tag" placeholder="タグを入力...">
          <button class="btn-tag-add" id="btn-add-tag">追加</button>
        </div>
        <div class="suggestions" id="tag-suggestions"></div>
        <div class="tag-list" id="selected-tags"></div>
      </div>
      <button class="btn btn-primary" id="btn-register" style="width:100%;margin-top:0.5rem">韻を登録する</button>
    </div>

    <!-- Dictionary Panel -->
    <div id="panel-dictionary" class="panel">
      <div class="filter-bar">
        <input type="search" id="dict-search" placeholder="検索...">
        <select id="dict-tag-filter" style="padding:0.7rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:0.9rem">
          <option value="">全タグ</option>
        </select>
      </div>
      <div id="dict-count" style="color:var(--text-dim);font-size:0.85rem;margin-bottom:0.5rem"></div>
      <div id="word-list" class="word-grid"></div>
    </div>

    <!-- Search Panel -->
    <div id="panel-search" class="panel">
      <div class="form-group">
        <label>韻を探したい言葉の読み（ひらがな）</label>
        <input type="text" id="search-reading" placeholder="例: みらい">
      </div>
      <button class="btn btn-primary" id="btn-search" style="width:100%">韻を検索</button>
      <div id="search-info" style="margin-top:1rem"></div>
      <div id="search-results" class="word-grid" style="margin-top:0.5rem"></div>
    </div>

    <!-- Favorites Panel -->
    <div id="panel-favorites" class="panel">
      <div id="fav-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ============================
// Hiragana -> Romaji conversion
// ============================
const HIRAGANA_MAP = [
  ['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],
  ['しゃ','sha'],['しゅ','shu'],['しょ','sho'],
  ['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho'],
  ['にゃ','nya'],['にゅ','nyu'],['にょ','nyo'],
  ['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo'],
  ['みゃ','mya'],['みゅ','myu'],['みょ','myo'],
  ['りゃ','rya'],['りゅ','ryu'],['りょ','ryo'],
  ['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo'],
  ['じゃ','ja'],['じゅ','ju'],['じょ','jo'],
  ['びゃ','bya'],['びゅ','byu'],['びょ','byo'],
  ['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo'],
  ['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go'],
  ['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo'],
  ['だ','da'],['ぢ','di'],['づ','du'],['で','de'],['ど','do'],
  ['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo'],
  ['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po'],
  ['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],
  ['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so'],
  ['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],
  ['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],
  ['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],
  ['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo'],
  ['や','ya'],['ゆ','yu'],['よ','yo'],
  ['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],
  ['わ','wa'],['を','wo'],['ん','n'],
  ['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],
  ['ー','-'],['っ','Q'],
];

function toRomaji(hiragana) {
  let result = '', i = 0;
  while (i < hiragana.length) {
    let matched = false;
    if (i + 1 < hiragana.length) {
      const two = hiragana.substring(i, i + 2);
      for (const [k, r] of HIRAGANA_MAP) {
        if (k === two) { result += r; i += 2; matched = true; break; }
      }
    }
    if (!matched) {
      const one = hiragana[i];
      let found = false;
      for (const [k, r] of HIRAGANA_MAP) {
        if (k === one) { result += r; found = true; break; }
      }
      if (!found) result += one;
      i++;
    }
  }
  return result;
}

function extractVowels(romaji) {
  return romaji.replace(/[^aiueo]/g, '');
}

// ============================
// Rhyme hardness
// ============================
function calcRhymeHardness(v1, v2) {
  const a = v1.split(''), b = v2.split('');
  let matchCount = 0;
  let i = a.length - 1, j = b.length - 1;
  while (i >= 0 && j >= 0) {
    if (a[i] === b[j]) { matchCount++; i--; j--; }
    else break;
  }
  const shorter = Math.min(a.length, b.length);
  const hardness = shorter > 0 ? matchCount / shorter : 0;
  let label;
  if (matchCount === 0) label = '韻なし';
  else if (hardness < 0.4) label = '柔らかい';
  else if (hardness < 0.7) label = 'まあまあ';
  else if (hardness < 1.0) label = '硬い';
  else label = 'ガチガチ';
  return { matchCount, hardness: Math.round(hardness * 100), label };
}

// ============================
// LocalStorage Database
// ============================
function loadData() {
  const raw = localStorage.getItem('rhymedict_v2');
  if (raw) return JSON.parse(raw);
  return { words: [], favorites: [], nextWordId: 1, nextFavId: 1 };
}

function saveData(data) {
  localStorage.setItem('rhymedict_v2', JSON.stringify(data));
}

let db = loadData();

// Get all unique tags from registered words
function getAllTags() {
  const tagSet = new Set();
  for (const w of db.words) {
    if (w.tags) w.tags.forEach(t => tagSet.add(t));
  }
  return [...tagSet].sort();
}

// ============================
// Toast
// ============================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================
// State
// ============================
let currentTags = []; // tags for current registration

// ============================
// Tab navigation
// ============================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'dictionary') loadDictionary();
    if (btn.dataset.tab === 'favorites') loadFavorites();
  });
});

// ============================
// Live Preview
// ============================
const inputReading = document.getElementById('input-reading');
const previewBox = document.getElementById('live-preview');
const previewRomaji = document.getElementById('preview-romaji');
const previewVowels = document.getElementById('preview-vowels');

inputReading.addEventListener('input', () => {
  const val = inputReading.value.trim();
  if (val) {
    const r = toRomaji(val);
    const v = extractVowels(r);
    previewRomaji.textContent = r;
    previewVowels.textContent = v.split('').join(' - ');
    previewBox.style.display = 'block';
  } else {
    previewBox.style.display = 'none';
  }
});

// ============================
// Free-form Tag Input
// ============================
const inputTag = document.getElementById('input-tag');
const btnAddTag = document.getElementById('btn-add-tag');
const selectedTagsEl = document.getElementById('selected-tags');
const tagSuggestionsEl = document.getElementById('tag-suggestions');

function addTag(name) {
  name = name.trim();
  if (!name || currentTags.includes(name)) return;
  currentTags.push(name);
  renderSelectedTags();
  inputTag.value = '';
  renderTagSuggestions();
}

function removeTag(name) {
  currentTags = currentTags.filter(t => t !== name);
  renderSelectedTags();
}

function renderSelectedTags() {
  selectedTagsEl.innerHTML = currentTags.map(t =>
    `<span class="tag-chip selected">${t}<span class="tag-remove" data-tag="${t}"> x</span></span>`
  ).join('');
  selectedTagsEl.querySelectorAll('.tag-remove').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      removeTag(el.dataset.tag);
    });
  });
}

function renderTagSuggestions() {
  const existing = getAllTags().filter(t => !currentTags.includes(t));
  const query = inputTag.value.trim().toLowerCase();
  const filtered = query ? existing.filter(t => t.toLowerCase().includes(query)) : existing;
  tagSuggestionsEl.innerHTML = filtered.slice(0, 10).map(t =>
    `<span class="suggestion" data-tag="${t}">${t}</span>`
  ).join('');
  tagSuggestionsEl.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => addTag(el.dataset.tag));
  });
}

btnAddTag.addEventListener('click', () => addTag(inputTag.value));
inputTag.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(inputTag.value); } });
inputTag.addEventListener('input', renderTagSuggestions);

// ============================
// Register
// ============================
document.getElementById('btn-register').addEventListener('click', () => {
  const reading = inputReading.value.trim();
  const displayName = document.getElementById('input-display').value.trim();
  if (!reading) { showToast('読み（ひらがな）を入力してください'); return; }
  if (!/^[\u3040-\u309Fー]+$/.test(reading)) { showToast('読みはひらがなで入力してください'); return; }

  const romaji = toRomaji(reading);
  const vowelPattern = extractVowels(romaji);

  const word = {
    id: db.nextWordId++,
    display: displayName || reading,
    reading, romaji, vowel_pattern: vowelPattern,
    tags: [...currentTags],
    created_at: new Date().toISOString()
  };
  db.words.push(word);
  saveData(db);

  showToast(`「${word.display}」を登録しました！`);
  document.getElementById('input-display').value = '';
  inputReading.value = '';
  previewBox.style.display = 'none';
  currentTags = [];
  renderSelectedTags();
  renderTagSuggestions();
});

// ============================
// Dictionary
// ============================
function loadDictionary() {
  renderTagFilter();
  const search = document.getElementById('dict-search').value.trim().toLowerCase();
  const tag = document.getElementById('dict-tag-filter').value;

  let words = db.words;
  if (search) {
    words = words.filter(w => w.display.toLowerCase().includes(search) || w.reading.includes(search));
  }
  if (tag) {
    words = words.filter(w => w.tags && w.tags.includes(tag));
  }

  words = [...words].sort((a, b) => a.vowel_pattern.localeCompare(b.vowel_pattern) || a.reading.localeCompare(b.reading));

  const list = document.getElementById('word-list');
  document.getElementById('dict-count').textContent = `${words.length}語 登録済み`;

  if (words.length === 0) {
    list.innerHTML = '<div class="empty">まだ単語が登録されていません。<br>「登録」タブから韻を育てよう！</div>';
    return;
  }

  const groups = {};
  for (const w of words) {
    if (!groups[w.vowel_pattern]) groups[w.vowel_pattern] = [];
    groups[w.vowel_pattern].push(w);
  }

  let html = '';
  for (const [pattern, groupWords] of Object.entries(groups)) {
    html += `<div class="vowel-group-header">${pattern.split('').join(' - ')}</div>`;
    for (const w of groupWords) {
      const tags = w.tags ? w.tags.map(t => `<span class="tag-badge">${t}</span>`).join('') : '';
      const showReading = w.display !== w.reading ? `<span class="word-reading">${w.reading}</span>` : '';
      html += `
        <div class="word-card">
          <div class="word-info">
            <span class="word-display">${w.display}</span>
            ${showReading}
            <div class="word-meta">
              <span class="vowel-badge">${w.vowel_pattern}</span>
              ${tags}
            </div>
          </div>
          <div class="word-actions">
            <button class="btn btn-small btn-ghost" onclick="findRhymes(${w.id})">韻を探す</button>
            <button class="btn btn-small btn-danger" onclick="deleteWord(${w.id})">削除</button>
          </div>
        </div>`;
    }
  }
  list.innerHTML = html;
}

function renderTagFilter() {
  const select = document.getElementById('dict-tag-filter');
  const current = select.value;
  select.innerHTML = '<option value="">全タグ</option>' +
    getAllTags().map(t => `<option value="${t}" ${t === current ? 'selected' : ''}>${t}</option>`).join('');
}

document.getElementById('dict-search').addEventListener('input', debounce(loadDictionary, 300));
document.getElementById('dict-tag-filter').addEventListener('change', loadDictionary);

function deleteWord(id) {
  if (!confirm('この単語を削除しますか？')) return;
  db.words = db.words.filter(w => w.id !== id);
  db.favorites = db.favorites.filter(f => f.word1Id !== id && f.word2Id !== id);
  saveData(db);
  showToast('削除しました');
  loadDictionary();
}

// ============================
// Find Rhymes (from dictionary)
// ============================
function findRhymes(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="search"]').classList.add('active');
  document.getElementById('panel-search').classList.add('active');

  const word = db.words.find(w => w.id === id);
  if (!word) return;

  document.getElementById('search-reading').value = word.reading;

  const rhymes = db.words
    .filter(w => w.id !== id)
    .map(w => ({ ...w, rhyme: calcRhymeHardness(word.vowel_pattern, w.vowel_pattern) }))
    .filter(w => w.rhyme.matchCount > 0)
    .sort((a, b) => b.rhyme.matchCount - a.rhyme.matchCount);

  document.getElementById('search-info').innerHTML = `
    <div class="preview-box">
      <strong>${word.display}</strong>（${word.reading}）の韻
      <div class="vowels" style="margin-top:0.3rem">${word.vowel_pattern.split('').join(' - ')}</div>
    </div>
  `;
  renderRhymeResults(document.getElementById('search-results'), rhymes, word.id);
}

// ============================
// Reverse Lookup
// ============================
document.getElementById('btn-search').addEventListener('click', () => {
  const reading = document.getElementById('search-reading').value.trim();
  if (!reading) { showToast('読みを入力してください'); return; }

  const romaji = toRomaji(reading);
  const vowelPattern = extractVowels(romaji);

  const rhymes = db.words
    .map(w => ({ ...w, rhyme: calcRhymeHardness(vowelPattern, w.vowel_pattern) }))
    .filter(w => w.rhyme.matchCount > 0)
    .sort((a, b) => b.rhyme.matchCount - a.rhyme.matchCount);

  document.getElementById('search-info').innerHTML = `
    <div class="preview-box">
      <div>ローマ字: <span class="romaji">${romaji}</span></div>
      <div>母音: <span class="vowels">${vowelPattern.split('').join(' - ')}</span></div>
    </div>
  `;
  renderRhymeResults(document.getElementById('search-results'), rhymes, null);
});

function renderRhymeResults(container, rhymes, sourceWordId) {
  if (rhymes.length === 0) {
    container.innerHTML = '<div class="empty">韻が見つかりませんでした。<br>もっと言葉を登録して辞書を育てよう！</div>';
    return;
  }
  container.innerHTML = rhymes.map(r => {
    const hClass = hardnessClass(r.rhyme.label);
    const tags = r.tags ? r.tags.map(t => `<span class="tag-badge">${t}</span>`).join('') : '';
    const showReading = r.display !== r.reading ? `<span class="word-reading">${r.reading}</span>` : '';
    const favBtn = sourceWordId
      ? `<button class="btn btn-small btn-ghost" onclick="saveFavorite(${sourceWordId},${r.id})">&#9825;</button>`
      : '';
    return `
      <div class="rhyme-card">
        <div>
          <span class="word-display">${r.display}</span>
          ${showReading}
          <div class="word-meta">
            <span class="vowel-badge">${r.vowel_pattern}</span>
            ${tags}
          </div>
        </div>
        <div style="text-align:right;display:flex;gap:0.4rem;align-items:center">
          <div>
            <span class="hardness-badge ${hClass}">${r.rhyme.label}</span>
            <div class="rhyme-match-info">${r.rhyme.matchCount}母音一致 (${r.rhyme.hardness}%)</div>
          </div>
          ${favBtn}
        </div>
      </div>`;
  }).join('');
}

function hardnessClass(label) {
  switch (label) {
    case 'ガチガチ': return 'hardness-gachigachi';
    case '硬い': return 'hardness-katai';
    case 'まあまあ': return 'hardness-maamaa';
    case '柔らかい': return 'hardness-yawarakai';
    default: return '';
  }
}

// ============================
// Favorites
// ============================
function saveFavorite(w1, w2) {
  const exists = db.favorites.some(f =>
    (f.word1Id === Math.min(w1,w2) && f.word2Id === Math.max(w1,w2))
  );
  if (exists) { showToast('既にお気に入りに登録済みです'); return; }
  db.favorites.push({ id: db.nextFavId++, word1Id: Math.min(w1,w2), word2Id: Math.max(w1,w2), created_at: new Date().toISOString() });
  saveData(db);
  showToast('お気に入りに追加しました！');
}

function loadFavorites() {
  const container = document.getElementById('fav-list');
  if (db.favorites.length === 0) {
    container.innerHTML = '<div class="empty">お気に入りの韻ペアはまだありません。<br>韻を検索して &#9825; で保存しよう！</div>';
    return;
  }
  container.innerHTML = db.favorites.map(f => {
    const w1 = db.words.find(w => w.id === f.word1Id);
    const w2 = db.words.find(w => w.id === f.word2Id);
    if (!w1 || !w2) return '';
    const rhyme = calcRhymeHardness(w1.vowel_pattern, w2.vowel_pattern);
    const hClass = hardnessClass(rhyme.label);
    return `
      <div class="fav-card">
        <div class="fav-pair">
          <span class="word-display">${w1.display}</span>
          <span class="fav-vs">x</span>
          <span class="word-display">${w2.display}</span>
          <span class="hardness-badge ${hClass}">${rhyme.label}</span>
        </div>
        <button class="btn btn-small btn-danger" onclick="deleteFavorite(${f.id})">削除</button>
      </div>`;
  }).join('');
}

function deleteFavorite(id) {
  db.favorites = db.favorites.filter(f => f.id !== id);
  saveData(db);
  showToast('お気に入りを削除しました');
  loadFavorites();
}

// ============================
// Utils
// ============================
function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

// ============================
// Init
// ============================
renderTagSuggestions();
</script>
</body>
</html>
